name: Identity-Aware No-New-Debt Baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  baseline-check:
    name: Baseline Comparison
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for merge-base
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Fetch main branch
        run: git fetch origin main
      
      - name: Check if baseline exists
        id: baseline_check
        run: |
          if [ -f .github/ci/baselines/main.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Baseline found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  Baseline not found (bootstrap scenario)"
          fi
      
      - name: Download pre-collected TypeScript diagnostics
        if: steps.baseline_check.outputs.exists == 'true'
        uses: actions/download-artifact@v4
        with:
          name: typescript-full-diagnostics
          path: .cache/tsbuildinfo
        continue-on-error: true

      - name: Collect diagnostic artifacts (Single Producer)
        if: steps.baseline_check.outputs.exists == 'true'
        run: |
          TS_ARG=""
          if [ -f .cache/tsbuildinfo/full.diagnostics.txt ]; then
            TS_ARG="--typescript-output .cache/tsbuildinfo/full.diagnostics.txt"
            echo "✅ Using pre-collected TypeScript diagnostics from artifact"
          fi
          npx tsx scripts/ci/baseline/collect-artifacts.ts --out-dir ./artifacts $TS_ARG

      - name: Run pure baseline comparison
        if: steps.baseline_check.outputs.exists == 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'main' }}
          PR_HEAD_SHA: ${{ github.sha }}
          PR_TARGET_BRANCH: ${{ github.base_ref || 'main' }}
          BASELINE_PATH: .github/ci/baselines/main.json
        run: |
          npx tsx scripts/ci/baseline/compare-with-baseline.ts \
            --baseline $BASELINE_PATH \
            --artifacts-dir ./artifacts \
            --pr-base $PR_BASE_SHA \
            --pr-head $PR_HEAD_SHA
      
      - name: Skip baseline check (bootstrap)
        if: steps.baseline_check.outputs.exists == 'false'
        run: |
          echo "⚠️  BOOTSTRAP SCENARIO"
          echo "Baseline file not found: .github/ci/baselines/main.json"
          echo ""
          echo "This is expected for infrastructure PR #117 before baseline generation."
          echo "Baseline will be generated immediately after infrastructure merge."
          echo ""
          echo "✅ Skipping baseline comparison (documented bootstrap exception)"
      
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-comparison-report
          path: baseline-comparison-report.txt
          retention-days: 30

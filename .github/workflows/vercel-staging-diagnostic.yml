name: Vercel Staging Credential Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Read-only Vercel credential and target inspection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect the same repository secrets used by Decision Engine staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EXPECTED_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          STAGING_PROJECT_ID: ${{ vars.VERCEL_STAGING_PROJECT_ID }}
          PRODUCTION_PROJECT_ID: ${{ vars.VERCEL_PRODUCTION_PROJECT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const e = process.env;
          const report = {
            source: 'repository secrets; no job environment; same secret names as Decision Engine staging',
            tokenPresent: Boolean(e.VERCEL_TOKEN),
            orgPresent: Boolean(e.VERCEL_ORG_ID),
            projectPresent: Boolean(e.VERCEL_PROJECT_ID),
            orgMatchesRepositoryVar: Boolean(e.EXPECTED_ORG_ID) && e.VERCEL_ORG_ID === e.EXPECTED_ORG_ID,
            stagingProjectConfigured: Boolean(e.STAGING_PROJECT_ID),
            targetMatchesStaging: Boolean(e.STAGING_PROJECT_ID) && e.VERCEL_PROJECT_ID === e.STAGING_PROJECT_ID,
            targetMatchesProduction: Boolean(e.PRODUCTION_PROJECT_ID) && e.VERCEL_PROJECT_ID === e.PRODUCTION_PROJECT_ID,
          };
          async function get(label, endpoint) {
            if (!e.VERCEL_TOKEN) return null;
            try {
              const response = await fetch('https://api.vercel.com' + endpoint, {
                headers: { Authorization: `Bearer ${e.VERCEL_TOKEN}` },
                redirect: 'error', signal: AbortSignal.timeout(15000),
              });
              report[label + 'HttpStatus'] = response.status;
              // Never print full API responses, token values or environment configuration.
              return response.ok ? await response.json() : null;
            } catch {
              report[label + 'RequestFailed'] = true;
              return null;
            }
          }
          const user = await get('user', '/v2/user');
          report.userAuthenticated = Boolean(user?.user?.id);
          report.expectedAccount = user?.user?.username === 'bellaspahcm-8249';
          const team = e.VERCEL_ORG_ID ? await get('team', '/v2/teams/' + encodeURIComponent(e.VERCEL_ORG_ID)) : null;
          report.teamIdentityMatches = Boolean(team?.id) && team.id === e.VERCEL_ORG_ID;
          report.expectedTeam = team?.slug === 'bella-spa-s-projects';
          const project = e.VERCEL_PROJECT_ID && e.VERCEL_ORG_ID ? await get('project',
            '/v9/projects/' + encodeURIComponent(e.VERCEL_PROJECT_ID) + '?teamId=' + encodeURIComponent(e.VERCEL_ORG_ID)) : null;
          report.projectIdentityMatches = Boolean(project?.id) && project.id === e.VERCEL_PROJECT_ID;
          report.projectOwnedByConfiguredOrg = Boolean(project?.accountId) && project.accountId === e.VERCEL_ORG_ID;
          report.credentialAndTargetVerified = report.userAuthenticated && report.teamIdentityMatches
            && report.projectIdentityMatches && report.projectOwnedByConfiguredOrg
            && report.orgMatchesRepositoryVar && report.targetMatchesStaging && !report.targetMatchesProduction;
          console.log(JSON.stringify(report, null, 2));
          appendFileSync(e.GITHUB_STEP_SUMMARY, 'Read-only diagnostic; no secrets changed; no deployment performed.\n\n```json\n'
            + JSON.stringify(report, null, 2) + '\n```\n');
          if (!report.credentialAndTargetVerified) process.exitCode = 1;
          NODE

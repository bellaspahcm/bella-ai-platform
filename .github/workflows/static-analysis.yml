name: Static Analysis Security Suite

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 18 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check if application code changed
        id: check-code
        env:
          SEMGREP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SEMGREP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          # Manual/scheduled scans and a new branch have no prior comparison.
          case "$GITHUB_EVENT_NAME" in
            pull_request|push) ;;
            *) echo "has_code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$SEMGREP_BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          : "${SEMGREP_BASE_SHA:?Missing comparison base}"
          : "${SEMGREP_HEAD_SHA:?Missing comparison head}"
          case "$SEMGREP_BASE_SHA$SEMGREP_HEAD_SHA" in
            *[!0-9a-f]*) echo "Invalid comparison revision" >&2; exit 1 ;;
          esac
          if [ "${#SEMGREP_BASE_SHA}" -ne 40 ] || [ "${#SEMGREP_HEAD_SHA}" -ne 40 ]; then
            echo "Invalid comparison revision" >&2
            exit 1
          fi

          # Trust only this checkout for these commands, not a global directory.
          # Any Git error must fail the step, never reduce the security scan.
          git -c safe.directory="$GITHUB_WORKSPACE" fetch --no-tags origin "$SEMGREP_BASE_SHA" "$SEMGREP_HEAD_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            CHANGED_FILES=$(git -c safe.directory="$GITHUB_WORKSPACE" diff --no-renames --name-only "$SEMGREP_BASE_SHA...$SEMGREP_HEAD_SHA")
          else
            CHANGED_FILES=$(git -c safe.directory="$GITHUB_WORKSPACE" diff --no-renames --name-only "$SEMGREP_BASE_SHA" "$SEMGREP_HEAD_SHA")
          fi
          if [ -z "$CHANGED_FILES" ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HAS_CODE=false
          while IFS= read -r FILE; do
            case "$FILE" in
              .github/*|docs/*|scripts/*|.eslintignore|.trivyignore) ;;
              *) HAS_CODE=true ;;
            esac
          done <<EOF
          $CHANGED_FILES
          EOF

          if [ "$HAS_CODE" = "true" ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            echo "✅ Found application code to scan"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "Infrastructure-only scope recorded; full report remains mandatory"
            echo "All changed files are infrastructure: .github/, docs/, scripts/"
          fi

      - name: Verify gate failure paths
        run: python3 scripts/test_semgrep_gate.py

      - name: Full report and native PR or main-push baseline gate
        env:
          SEMGREP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SEMGREP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/run-semgrep-gate.py

      - name: Upload full Semgrep SARIF
        if: ${{ always() && hashFiles('semgrep-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-full-report

      - name: Archive full report, diff and gate decision
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: |
            semgrep-results.sarif
            semgrep-diff.sarif
            semgrep-gate.json
          if-no-files-found: error
          retention-days: 14

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan secrets with Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  trivy:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Check if dependency files changed
        id: check-deps
        run: |
          # Get changed files
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_BASE_REF"
            CHANGED_FILES=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          fi
          
          # Trivy dependency/container scan is scoped to dependency and container
          # inputs. Test-only source changes are covered by test jobs and Gitleaks.
          if echo "$CHANGED_FILES" | grep -qE '(^|/)package\.json$|(^|/)package-lock\.json$|(^|/)Dockerfile$|(^|/)\.dockerignore$|^\.trivyignore$'; then
            echo "has_deps=true" >> $GITHUB_OUTPUT
            echo "✅ Found dependency/container files to scan"
          else
            echo "has_deps=false" >> $GITHUB_OUTPUT
            echo "⏭️  No dependency/container files changed, skipping Trivy scan"
          fi

      - name: Run Trivy filesystem scan
        if: steps.check-deps.outputs.has_deps == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          skip-dirs: node_modules,mcp-server/node_modules,.next,test-results
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Archive Trivy SARIF
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 14

      - name: Gate fixable high and critical vulnerabilities
        if: steps.check-deps.outputs.has_deps == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          skip-dirs: node_modules,mcp-server/node_modules,.next,test-results
          exit-code: "1"
      
      - name: Trivy skipped (infrastructure-only PR)
        if: steps.check-deps.outputs.has_deps == 'false'
        run: echo "✅ Trivy filesystem scan skipped - no dependency files changed"

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: SonarQube skipped
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' }}
        run: echo "Configure SONAR_TOKEN and SONAR_HOST_URL to enable SonarQube scanning."

      - name: Run SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

name: Quality and Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect_changes:
    name: Detect Changed Scope
    runs-on: ubuntu-latest
    outputs:
      scope_level: ${{ steps.scope.outputs.scope_level }}
      needs_build: ${{ steps.scope.outputs.needs_build }}
      needs_e2e: ${{ steps.scope.outputs.needs_e2e }}
      needs_real_db_e2e: ${{ steps.scope.outputs.needs_real_db_e2e }}
      needs_migration_gates: ${{ steps.scope.outputs.needs_migration_gates }}
      needs_api_docs: ${{ steps.scope.outputs.needs_api_docs }}
      needs_dependency_security_deep: ${{ steps.scope.outputs.needs_dependency_security_deep }}
      needs_security_lightweight: ${{ steps.scope.outputs.needs_security_lightweight }}
      scope_message: ${{ steps.scope.outputs.scope_message }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Classify scope
        id: scope
        run: node scripts/ci-scope-router.mjs --fail-on-block

  quality-security:
    needs: detect_changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Restore CI caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/tsbuildinfo
            .jest-cache
            .next/cache
          key: ${{ runner.os }}-quality-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'jest.config.*', 'next.config.*') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-quality-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'jest.config.*', 'next.config.*') }}-
            ${{ runner.os }}-quality-

      - name: Install dependencies
        run: npm ci
      
      - name: Check if TypeScript/JavaScript files changed
        id: check-lint-needed
        run: |
          # Get changed files
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_BASE_REF" || true
            CHANGED_FILES=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD 2>/dev/null || echo "")
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")
          fi
          
          # Check if any application TS/JS files changed (exclude infra and tests)
          if echo "$CHANGED_FILES" | grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$' | grep -vE '^(scripts/|\.github/|src/__tests__/)|\.(test|spec)\.(ts|tsx|js|jsx)$' | grep -q '.'; then
            echo "needs_lint=true" >> $GITHUB_OUTPUT
            echo "✅ Found application TS/JS files to lint"
          else
            echo "needs_lint=false" >> $GITHUB_OUTPUT
            echo "⏭️  No application code changed, skipping lint"
          fi

          if echo "$CHANGED_FILES" | grep -qE '^(src/app/api/|docs/guides/api-reference\.md|docs/technical/api-versioning-policy\.md|docs/api-reference\.md|docs/api-versioning-policy\.md|scripts/check-api-docs\.mjs|scripts/check-api-versioning\.mjs)'; then
            echo "needs_api_docs=true" >> $GITHUB_OUTPUT
            echo "✅ Found API surface or API documentation files to verify"
          else
            echo "needs_api_docs=false" >> $GITHUB_OUTPUT
            echo "⏭️  No API surface or API documentation changes, skipping API docs checks"
          fi

          if echo "$CHANGED_FILES" | grep -qE '^(src/(app|components|core|lib|modules|platform|products|services|shared)/|supabase/|database/|migrations/|prisma/migrations/|package\.json|package-lock\.json|scripts/check-supabase-|scripts/check-business-invariants\.cjs|.*\.sql$)'; then
            echo "needs_db_checks=true" >> $GITHUB_OUTPUT
            echo "✅ Found database, application, or DB-check files to verify"
          else
            echo "needs_db_checks=false" >> $GITHUB_OUTPUT
            echo "⏭️  No database, application, or DB-check changes, skipping live DB checks"
          fi

          if echo "$CHANGED_FILES" | grep -qE '(^|/)package\.json$|(^|/)package-lock\.json$|^scripts/(audit-production|check-secret-leaks)\.mjs$|^src/__tests__/log-redactor\.test\.ts$'; then
            echo "needs_security_checks=true" >> $GITHUB_OUTPUT
            echo "✅ Found dependency/security files to verify"
          else
            echo "needs_security_checks=false" >> $GITHUB_OUTPUT
            echo "⏭️  No dependency/security files changed, skipping dependency audit and secret guards"
          fi

          if echo "$CHANGED_FILES" | grep -qE '^(src/app/|src/components/|src/lib/|src/services/|src/modules/|src/products/|e2e/|playwright\.config\.|package\.json|package-lock\.json)'; then
            echo "needs_e2e_checks=true" >> $GITHUB_OUTPUT
            echo "✅ Found app, e2e, or package files to verify with browser smoke tests"
          else
            echo "needs_e2e_checks=false" >> $GITHUB_OUTPUT
            echo "⏭️  No app/e2e/package changes, skipping browser smoke tests"
          fi

      - name: Required CI environment config
        if: needs.detect_changes.outputs.needs_build == 'true' || needs.detect_changes.outputs.needs_e2e == 'true' || needs.detect_changes.outputs.needs_real_db_e2e == 'true'
        run: npm run ci:env:check

      - name: Lint
        if: steps.check-lint-needed.outputs.needs_lint == 'true'
        run: node scripts/lint-changed-files.mjs
      
      - name: Lint skipped (infrastructure-only PR)
        if: steps.check-lint-needed.outputs.needs_lint == 'false'
        run: echo "✅ Lint skipped - infrastructure-only PR"

      - name: API documentation coverage
        if: steps.check-lint-needed.outputs.needs_api_docs == 'true'
        run: npm run docs:api:check

      - name: API versioning policy
        if: steps.check-lint-needed.outputs.needs_api_docs == 'true'
        run: npm run docs:api:versioning

      - name: API documentation checks skipped
        if: steps.check-lint-needed.outputs.needs_api_docs == 'false'
        run: echo "✅ API docs checks skipped - no API surface or API documentation changes"

      - name: Supabase migration drift check
        if: needs.detect_changes.outputs.needs_migration_gates == 'true' && steps.check-lint-needed.outputs.needs_db_checks == 'true'
        run: npm run db:migration:check

      - name: Supabase RPC grant policy
        if: needs.detect_changes.outputs.needs_real_db_e2e == 'true' && steps.check-lint-needed.outputs.needs_db_checks == 'true'
        run: npm run db:rpc-grants:check

      - name: Supabase data access smoke
        if: needs.detect_changes.outputs.needs_real_db_e2e == 'true' && steps.check-lint-needed.outputs.needs_db_checks == 'true'
        run: npm run db:access:check

      - name: Supabase live RPC smoke
        if: needs.detect_changes.outputs.needs_real_db_e2e == 'true' && steps.check-lint-needed.outputs.needs_db_checks == 'true'
        run: npm run db:rpc-smoke:check

      - name: Business data invariant guard
        if: needs.detect_changes.outputs.needs_real_db_e2e == 'true' && steps.check-lint-needed.outputs.needs_db_checks == 'true'
        run: npm run db:business:check

      - name: Live DB checks skipped
        if: needs.detect_changes.outputs.needs_real_db_e2e != 'true' || steps.check-lint-needed.outputs.needs_db_checks == 'false'
        run: echo "✅ Live DB checks skipped - no database, application, or DB-check changes"

      - name: Production build
        if: needs.detect_changes.outputs.needs_build == 'true'
        run: npm run build

      - name: Critical regression tests
        if: needs.detect_changes.outputs.scope_level == 'platform'
        run: npm run test:critical

      - name: Export actions regression tests
        if: needs.detect_changes.outputs.scope_level == 'platform'
        run: npm test -- src/__tests__/export-actions.test.ts --runInBand

      - name: Dependency audit
        if: needs.detect_changes.outputs.needs_dependency_security_deep == 'true' && steps.check-lint-needed.outputs.needs_security_checks == 'true'
        run: npm run security:audit

      - name: Secret and log leak guard
        if: needs.detect_changes.outputs.needs_security_lightweight == 'true'
        run: npm run security:secrets

      - name: Log redaction tests
        if: needs.detect_changes.outputs.needs_dependency_security_deep == 'true' && steps.check-lint-needed.outputs.needs_security_checks == 'true'
        run: npm test -- src/__tests__/log-redactor.test.ts --runInBand

      - name: Security checks skipped
        if: needs.detect_changes.outputs.needs_security_lightweight != 'true'
        run: echo "✅ Security checks skipped - no dependency/security files changed"

      - name: Install Playwright Chromium
        if: needs.detect_changes.outputs.needs_e2e == 'true'
        run: npx playwright install --with-deps chromium

      - name: Authenticated route smoke
        if: needs.detect_changes.outputs.needs_e2e == 'true' && steps.check-lint-needed.outputs.needs_e2e_checks == 'true'
        timeout-minutes: 8
        run: npm run e2e:auth-smoke
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.E2E_VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Hospitality tenant profile HQ smoke
        if: needs.detect_changes.outputs.needs_e2e == 'true' && contains(needs.detect_changes.outputs.scope_message, 'Hospitality')
        timeout-minutes: 10
        run: npm run e2e:hospitality-tenant-profiles
        env:
          E2E_NEXT_DEV_BUNDLER: webpack
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}

      - name: Hospitality Hotel Core operations browser E2E
        if: needs.detect_changes.outputs.needs_e2e == 'true' && contains(needs.detect_changes.outputs.scope_message, 'Hospitality')
        timeout-minutes: 12
        run: npx playwright test e2e/tests/38-hospitality-hotel-core-chain-browser-e2e.spec.ts
        env:
          E2E_NEXT_DEV_BUNDLER: webpack
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_DB_URL: ${{ secrets.E2E_SUPABASE_DB_URL || secrets.SUPABASE_DB_URL || secrets.SUPABASE_DATABASE_URL }}

      - name: Manufacturing operational readiness browser E2E
        if: needs.detect_changes.outputs.needs_e2e == 'true' && contains(needs.detect_changes.outputs.scope_message, 'Manufacturing')
        timeout-minutes: 12
        run: npx playwright test e2e/tests/41-manufacturing-operational-readiness.spec.ts
        env:
          E2E_NEXT_DEV_BUNDLER: webpack
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_DB_URL: ${{ secrets.E2E_SUPABASE_DB_URL || secrets.SUPABASE_DB_URL || secrets.SUPABASE_DATABASE_URL }}

      - name: Beauty operational UAT smoke
        if: needs.detect_changes.outputs.scope_level == 'platform' && steps.check-lint-needed.outputs.needs_e2e_checks == 'true'
        timeout-minutes: 12
        run: npm run e2e:beauty-uat
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.E2E_VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Responsive visual smoke
        if: needs.detect_changes.outputs.scope_level == 'platform' && steps.check-lint-needed.outputs.needs_e2e_checks == 'true'
        timeout-minutes: 35
        run: npm run e2e:visual
        env:
          E2E_VISUAL_SMOKE_SCOPE: core
          E2E_VISUAL_EXPECTED_TESTS: "30"
          E2E_NAVIGATION_TIMEOUT_MS: "60000"
          E2E_NEXT_DEV_BUNDLER: "webpack"
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.E2E_VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Assert responsive visual smoke results
        if: needs.detect_changes.outputs.scope_level == 'platform' && steps.check-lint-needed.outputs.needs_e2e_checks == 'true'
        run: npm run e2e:visual:assert
        env:
          E2E_VISUAL_EXPECTED_TESTS: "30"

      - name: Browser smoke tests skipped
        if: needs.detect_changes.outputs.needs_e2e != 'true' || steps.check-lint-needed.outputs.needs_e2e_checks == 'false'
        run: echo "✅ Browser smoke tests skipped - no app/e2e/package changes"

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: responsive-visual-smoke-artifacts
          path: |
            playwright-report
            playwright-results.json
            test-results
          if-no-files-found: ignore

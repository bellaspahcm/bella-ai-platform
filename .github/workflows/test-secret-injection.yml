name: BDGF Signing Key Verification Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-key:
    if: github.repository == 'bellaspahcm/bella-ai-platform' && github.ref == 'refs/tags/bdgf-key-check-20261016'
    name: Verify key without DB or authorization token
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Install without lifecycle scripts or secrets
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused verification safety tests
        run: node --test scripts/bdgf/verify-production-signing-key.test.mjs
      - name: Verify approved signing secret in isolated processes
        env:
          GATE_SIGNING_KEY_FROM_SECRETS_MANAGER: ${{ secrets.GATE_SIGNING_KEY }}
          BDGF_USE_SECRETS_MANAGER: 'false'
          SECRETS_CACHE_ENABLED: 'false'
          NODE_OPTIONS: ''
          NODE_ENV: production
        run: node scripts/bdgf/verify-production-signing-key.mjs
      - name: Upload boolean-only evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bdgf-signing-key-verification-${{ github.sha }}
          path: .cache/bdgf-key-check/evidence.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

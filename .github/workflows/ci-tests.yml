name: CI - Quality Gates

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      run_education_t1:
        description: Run the allowlisted Education T1 database suites on an isolated disposable fixture
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  detect_changes:
    name: Detect Changed Scope
    runs-on: ubuntu-latest
    outputs:
      scope_status: ${{ steps.scope.outputs.scope_status }}
      scope_level: ${{ steps.scope.outputs.scope_level }}
      products: ${{ steps.scope.outputs.products }}
      os: ${{ steps.scope.outputs.os }}
      affected_products: ${{ steps.scope.outputs.affected_products }}
      needs_tests: ${{ steps.scope.outputs.needs_tests }}
      needs_build: ${{ steps.scope.outputs.needs_build }}
      needs_real_db_e2e: ${{ steps.scope.outputs.needs_real_db_e2e }}
      needs_migration_gates: ${{ steps.scope.outputs.needs_migration_gates }}
      needs_dependency_security_deep: ${{ steps.scope.outputs.needs_dependency_security_deep }}
      needs_security_lightweight: ${{ steps.scope.outputs.needs_security_lightweight }}
      scope_message: ${{ steps.scope.outputs.scope_message }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Classify scope
        id: scope
        run: node scripts/ci-scope-router.mjs --fail-on-block

  lint:
    name: Changed-file Lint
    needs: detect_changes
    if: needs.detect_changes.outputs.needs_security_lightweight == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Lint changed files
        run: node scripts/lint-changed-files.mjs

  tests:
    name: Affected Unit and Integration Tests
    needs: detect_changes
    if: needs.detect_changes.outputs.needs_tests == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_education_t1 == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Restore Jest cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .jest-cache
          key: ${{ runner.os }}-jest-${{ hashFiles('package-lock.json', 'jest.config.*') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-jest-${{ hashFiles('package-lock.json', 'jest.config.*') }}-
            ${{ runner.os }}-jest-

      - run: npm ci

      - name: Detect Education database suites
        id: education_fixture
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            if [ "$RUN_EDUCATION_T1" = 'true' ]; then
              test "$GITHUB_REF" = 'refs/heads/main' || { echo 'T1_MANUAL_RUN_MAIN_ONLY'; exit 1; }
              echo 'needed=true' >> "$GITHUB_OUTPUT"
              echo 'suites=src/platform/education/__tests__/verification-gates.test.ts,src/platform/education/__tests__/course-contract-real-db.integration.test.ts,src/platform/education/__tests__/kernel-invariants.integration.test.ts' >> "$GITHUB_OUTPUT"
            else
              echo 'needed=false' >> "$GITHUB_OUTPUT"
            fi
          else
            if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
              changed="$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")"
            else
              changed="$(git diff --name-only origin/main...HEAD)"
              if [ -z "$changed" ]; then
                changed="$(git diff --name-only HEAD^ HEAD)"
              fi
            fi
            suites="$(printf '%s\n' "$changed" | grep -E '^src/platform/education/__tests__/(verification-gates\.test\.ts|course-contract-real-db\.integration\.test\.ts|kernel-invariants\.integration\.test\.ts)$' || true)"
            if [ -n "$suites" ]; then
              echo 'needed=true' >> "$GITHUB_OUTPUT"
              echo "suites=$(printf '%s\n' "$suites" | tr '\n' ',')" >> "$GITHUB_OUTPUT"
            else
              echo 'needed=false' >> "$GITHUB_OUTPUT"
            fi
          fi
        env:
          RUN_EDUCATION_T1: ${{ inputs.run_education_t1 }}

      - name: Install Supabase CLI for disposable Education fixture
        if: steps.education_fixture.outputs.needed == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.115.0

      - name: Prepare disposable Education database
        if: steps.education_fixture.outputs.needed == 'true'
        run: bash scripts/ci/preschool-t1-fixture.sh prepare

      - name: Run related unit and integration suite
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ] && [ "$BELLA_T1_ENV_REQUIRED" = 'true' ]; then
            IFS=',' read -r -a t1_suites <<< "$BELLA_T1_EXPECTED_SUITES"
            node scripts/test-changed-files.mjs --jest-json-output "$RUNNER_TEMP/affected-jest.json" "${t1_suites[@]}"
          else
            node scripts/test-changed-files.mjs --jest-json-output "$RUNNER_TEMP/affected-jest.json"
          fi
        env:
          NODE_ENV: test
          JEST_CACHE_DIRECTORY: .jest-cache
          BELLA_T1_ENV_REQUIRED: ${{ steps.education_fixture.outputs.needed }}
          BELLA_T1_EXPECTED_SUITES: ${{ steps.education_fixture.outputs.suites }}

      - name: Verify disposable Education fixture receipts
        if: always() && steps.education_fixture.outputs.needed == 'true'
        env:
          T1_EXPECTED_SUITES: ${{ steps.education_fixture.outputs.suites }}
          T1_JEST_REPORT: ${{ runner.temp }}/affected-jest.json
        run: bash scripts/ci/preschool-t1-fixture.sh verify

      - name: Dispose only the owned Education database
        if: always() && steps.education_fixture.outputs.needed == 'true'
        run: bash scripts/ci/preschool-t1-fixture.sh dispose

      - name: Upload synthetic Education fixture receipts
        if: always() && steps.education_fixture.outputs.needed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preschool-affected-education-t1-receipts
          path: |
            ${{ runner.temp }}/bella-preschool-t1-20261022/receipts/*.json
            ${{ runner.temp }}/bella-preschool-t1-20261022/fixture-manifest.json
            ${{ runner.temp }}/bella-preschool-t1-20261022/owner-marker.json
          if-no-files-found: warn
          retention-days: 7

  real-db-e2e:
    name: Real Database Business E2E
    concurrency:
      group: bella-e2e-bmnbqbcdbuklhopfbopv
      cancel-in-progress: false
      queue: max
    needs: detect_changes
    if: needs.detect_changes.outputs.needs_real_db_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Resolve migration comparison base
        id: migration-base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$PR_BASE_SHA"
          if [ -z "$base" ]; then
            base="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$'; then
            base="HEAD^"
          fi
          git rev-parse --verify "$base^{commit}" > /dev/null
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Select disposable Preschool teacher profile
        id: preschool-profile
        env:
          BASE_REF: ${{ steps.migration-base.outputs.base }}
        shell: bash
        run: |
          changed="$(git diff --name-only "$BASE_REF...HEAD" -- supabase/migrations)"
          acceptance_control_changed="$(git diff --name-only "$BASE_REF...HEAD" -- scripts/ci/preschool-browser-profile/accept.ps1)"
          teacher_profile_migration=false
          unexpected_migration=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              supabase/migrations/20261027010000_preschool_teacher_assignment_legacy_profile.sql|\
              supabase/migrations/20261027010100_preschool_teacher_confirmation_and_canonical_assignment.sql|\
              supabase/migrations/20261027010200_preschool_teacher_termination_end_date_check.sql|\
              supabase/migrations/20261027010300_scope_attendance_state_with_authorized_helper.sql|\
              supabase/migrations/20261027020000_platform_current_actor_tenant_presentation.sql)
                teacher_profile_migration=true
                ;;
              *) unexpected_migration=true ;;
            esac
          done <<< "$changed"

          if { [ "$teacher_profile_migration" = true ] || [ -n "$acceptance_control_changed" ]; } && [ "$unexpected_migration" = true ]; then
            echo 'PRESCHOOL_PROFILE_MIXED_MIGRATION_SCOPE: split the PR or add an explicitly reviewed profile.'
            exit 1
          fi
          if [ "$teacher_profile_migration" = true ] || [ -n "$acceptance_control_changed" ]; then
            echo 'use_disposable=true' >> "$GITHUB_OUTPUT"
            echo 'Preschool profile acceptance will run only on a disposable local Supabase profile.'
          else
            echo 'use_disposable=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Require isolated E2E database credentials
        if: steps.preschool-profile.outputs.use_disposable != 'true'
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.E2E_SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_DB_URL"

      - name: Validate changed migrations before E2E apply
        env:
          BASE_REF: ${{ steps.migration-base.outputs.base }}
        run: npm run db:migration:zero-downtime -- --base "$BASE_REF"

      - name: Install Supabase CLI for disposable Preschool profile
        if: steps.preschool-profile.outputs.use_disposable == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.115.0

      - name: Prepare disposable Preschool schema and RLS profile
        id: preschool-prepare
        if: steps.preschool-profile.outputs.use_disposable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_revision="$(git rev-parse HEAD)"
          [[ "$source_revision" =~ ^[a-f0-9]{40}$ ]] || {
            echo 'PRESCHOOL_PROFILE_CHECKED_OUT_REVISION_INVALID' >&2
            exit 1
          }

          set +e
          prepare_output="$(pwsh -NoProfile -File scripts/ci/preschool-browser-profile/run.ps1 \
            -Action Prepare -SourceRevision "$source_revision" 2>&1)"
          prepare_status=$?
          set -e
          printf '%s\n' "$prepare_output"
          if [ "$prepare_status" -ne 0 ]; then
            exit "$prepare_status"
          fi

          run_directory="$(printf '%s\n' "$prepare_output" | sed -n 's/^PROFILE_RUN_DIRECTORY=//p' | tail -n 1)"
          if [ -z "$run_directory" ]; then
            echo 'PRESCHOOL_PROFILE_RUN_DIRECTORY_NOT_RETURNED' >&2
            exit 1
          fi
          printf 'run_directory=%s\n' "$run_directory" >> "$GITHUB_OUTPUT"

      - name: Install Chromium for teacher Browser E2E
        if: steps.preschool-profile.outputs.use_disposable == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run real teacher JWT, DB/RLS and Browser E2E on disposable profile
        id: preschool-acceptance
        if: steps.preschool-profile.outputs.use_disposable == 'true'
        shell: pwsh
        env:
          PROFILE_RUN_DIRECTORY: ${{ steps.preschool-prepare.outputs.run_directory }}
        run: pwsh -NoProfile -File scripts/ci/preschool-browser-profile/accept.ps1 -RunDirectory $env:PROFILE_RUN_DIRECTORY

      - name: Apply changed migrations to isolated E2E database
        if: steps.preschool-profile.outputs.use_disposable != 'true'
        env:
          ALLOW_E2E_MIGRATION_APPLY: '1'
          BASE_REF: ${{ steps.migration-base.outputs.base }}
          SUPABASE_DB_URL: ${{ secrets.E2E_SUPABASE_DB_URL }}
        run: node scripts/apply-e2e-pr-migrations.cjs --base "$BASE_REF"

      - name: Run real database business E2E
        if: steps.preschool-profile.outputs.use_disposable != 'true'
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.E2E_SUPABASE_DB_URL }}
          E2E_SUPABASE_DB_SSL_CA: ${{ secrets.E2E_SUPABASE_DB_SSL_CA }}
          JEST_CACHE_DIRECTORY: .jest-cache
        run: node scripts/run-scoped-real-db-e2e.mjs

      - name: Ensure disposable Preschool profile is cleaned
        if: always() && steps.preschool-profile.outputs.use_disposable == 'true' && steps.preschool-prepare.outputs.run_directory != '' && steps.preschool-acceptance.outcome != 'success'
        shell: pwsh
        env:
          PROFILE_RUN_DIRECTORY: ${{ steps.preschool-prepare.outputs.run_directory }}
        run: pwsh -NoProfile -File scripts/ci/preschool-browser-profile/run.ps1 -Action Cleanup -RunDirectory $env:PROFILE_RUN_DIRECTORY

      - name: Upload disposable Preschool acceptance receipt
        if: always() && steps.preschool-profile.outputs.use_disposable == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preschool-teacher-disposable-e2e-receipt
          path: |
            ${{ runner.temp }}/bella-preschool-disposable-profiles/*/manifest.snapshot.json
            ${{ runner.temp }}/bella-preschool-disposable-profiles/*/receipt.json
            ${{ runner.temp }}/bella-preschool-disposable-profiles/*/acceptance-receipt.json
            ${{ runner.temp }}/bella-preschool-disposable-profiles/*/application-overlay.json
            ${{ runner.temp }}/bella-preschool-disposable-profiles/*/migration-apply.log
            ${{ runner.temp }}/bella-preschool-disposable-profiles/*/schema-verification.log
            ${{ runner.temp }}/bella-preschool-disposable-profiles/*/next-dev.redacted.log
          if-no-files-found: warn
          retention-days: 7

  security:
    name: Security Gates
    needs: detect_changes
    if: needs.detect_changes.outputs.needs_security_lightweight == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Secret and log leak guard
        run: npm run security:secrets

      - name: Dependency audit
        if: needs.detect_changes.outputs.needs_dependency_security_deep == 'true'
        run: npm run security:audit

  migrations:
    name: Migration Gates
    needs: [detect_changes, real-db-e2e]
    if: needs.detect_changes.outputs.needs_migration_gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Resolve migration comparison base
        id: migration-base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$PR_BASE_SHA"
          if [ -z "$base" ]; then
            base="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$'; then
            base="HEAD^"
          fi
          git rev-parse --verify "$base^{commit}" > /dev/null
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Zero-downtime migration policy
        env:
          BASE_REF: ${{ steps.migration-base.outputs.base }}
        run: npm run db:migration:zero-downtime -- --base "$BASE_REF"

      - name: Require database drift credentials
        env:
          SUPABASE_DB_URL: ${{ secrets.E2E_SUPABASE_DB_URL }}
        run: test -n "$SUPABASE_DB_URL"

      - name: Supabase migration drift (E2E baseline)
        env:
          BASE_REF: ${{ steps.migration-base.outputs.base }}
          SUPABASE_DB_URL: ${{ secrets.E2E_SUPABASE_DB_URL }}
          DB_MIGRATION_CHECK_ALLOW_REMOTE_AHEAD_ONLY: '1'
        run: npm run db:migration:check

  build:
    name: Relevant App Build
    needs: detect_changes
    if: needs.detect_changes.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Restore Next cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json', 'next.config.*') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json', 'next.config.*') }}-
            ${{ runner.os }}-next-

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  all-gates:
    name: All Required Gates Passed
    if: always()
    needs: [detect_changes, lint, tests, real-db-e2e, security, migrations, build]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required results
        env:
          DETECT_RESULT: ${{ needs.detect_changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          REAL_DB_E2E_RESULT: ${{ needs.real-db-e2e.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          MIGRATION_RESULT: ${{ needs.migrations.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          for result in "$DETECT_RESULT" "$LINT_RESULT" "$TEST_RESULT" "$REAL_DB_E2E_RESULT" "$SECURITY_RESULT" "$MIGRATION_RESULT" "$BUILD_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Required gate failed or was cancelled: $result"; exit 1 ;;
            esac
          done

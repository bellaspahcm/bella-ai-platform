name: CI - Quality Gates

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_changes:
    name: Detect Changed Scope
    runs-on: ubuntu-latest
    outputs:
      scope_status: ${{ steps.scope.outputs.scope_status }}
      scope_level: ${{ steps.scope.outputs.scope_level }}
      products: ${{ steps.scope.outputs.products }}
      os: ${{ steps.scope.outputs.os }}
      affected_products: ${{ steps.scope.outputs.affected_products }}
      needs_tests: ${{ steps.scope.outputs.needs_tests }}
      needs_build: ${{ steps.scope.outputs.needs_build }}
      needs_real_db_e2e: ${{ steps.scope.outputs.needs_real_db_e2e }}
      needs_migration_gates: ${{ steps.scope.outputs.needs_migration_gates }}
      needs_dependency_security_deep: ${{ steps.scope.outputs.needs_dependency_security_deep }}
      needs_security_lightweight: ${{ steps.scope.outputs.needs_security_lightweight }}
      scope_message: ${{ steps.scope.outputs.scope_message }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Classify scope
        id: scope
        run: node scripts/ci-scope-router.mjs --fail-on-block

  lint:
    name: Changed-file Lint
    needs: detect_changes
    if: needs.detect_changes.outputs.needs_security_lightweight == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Lint changed files
        run: node scripts/lint-changed-files.mjs

  tests:
    name: Affected Unit and Integration Tests
    needs: detect_changes
    if: needs.detect_changes.outputs.needs_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Restore Jest cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .jest-cache
          key: ${{ runner.os }}-jest-${{ hashFiles('package-lock.json', 'jest.config.*') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-jest-${{ hashFiles('package-lock.json', 'jest.config.*') }}-
            ${{ runner.os }}-jest-

      - run: npm ci

      - name: Run related unit and integration suite
        run: node scripts/test-changed-files.mjs
        env:
          NODE_ENV: test
          JEST_CACHE_DIRECTORY: .jest-cache

  real-db-e2e:
    name: Real Database Business E2E
    needs: detect_changes
    if: needs.detect_changes.outputs.needs_real_db_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Resolve migration comparison base
        id: migration-base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$PR_BASE_SHA"
          if [ -z "$base" ]; then
            base="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$'; then
            base="HEAD^"
          fi
          git rev-parse --verify "$base^{commit}" > /dev/null
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Require isolated E2E database credentials
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.E2E_SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_DB_URL"

      - name: Validate changed migrations before E2E apply
        env:
          BASE_REF: ${{ steps.migration-base.outputs.base }}
        run: npm run db:migration:zero-downtime -- --base "$BASE_REF"

      - name: Apply changed migrations to isolated E2E database
        env:
          ALLOW_E2E_MIGRATION_APPLY: '1'
          BASE_REF: ${{ steps.migration-base.outputs.base }}
          SUPABASE_DB_URL: ${{ secrets.E2E_SUPABASE_DB_URL }}
        run: node scripts/apply-e2e-pr-migrations.cjs --base "$BASE_REF"

      - name: Run real database business E2E
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.E2E_SUPABASE_DB_URL }}
          E2E_SUPABASE_DB_SSL_CA: ${{ secrets.E2E_SUPABASE_DB_SSL_CA }}
          JEST_CACHE_DIRECTORY: .jest-cache
        run: node scripts/run-scoped-real-db-e2e.mjs

  security:
    name: Security Gates
    needs: detect_changes
    if: needs.detect_changes.outputs.needs_security_lightweight == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Secret and log leak guard
        run: npm run security:secrets

      - name: Dependency audit
        if: needs.detect_changes.outputs.needs_dependency_security_deep == 'true'
        run: npm run security:audit

  migrations:
    name: Migration Gates
    needs: [detect_changes, real-db-e2e]
    if: needs.detect_changes.outputs.needs_migration_gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Resolve migration comparison base
        id: migration-base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$PR_BASE_SHA"
          if [ -z "$base" ]; then
            base="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$'; then
            base="HEAD^"
          fi
          git rev-parse --verify "$base^{commit}" > /dev/null
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Zero-downtime migration policy
        env:
          BASE_REF: ${{ steps.migration-base.outputs.base }}
        run: npm run db:migration:zero-downtime -- --base "$BASE_REF"

      - name: Require database drift credentials
        env:
          SUPABASE_DB_URL: ${{ secrets.E2E_SUPABASE_DB_URL }}
        run: test -n "$SUPABASE_DB_URL"

      - name: Supabase migration drift (E2E baseline)
        env:
          BASE_REF: ${{ steps.migration-base.outputs.base }}
          SUPABASE_DB_URL: ${{ secrets.E2E_SUPABASE_DB_URL }}
          DB_MIGRATION_CHECK_ALLOW_REMOTE_AHEAD_ONLY: '1'
        run: npm run db:migration:check

  build:
    name: Relevant App Build
    needs: detect_changes
    if: needs.detect_changes.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Restore Next cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json', 'next.config.*') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json', 'next.config.*') }}-
            ${{ runner.os }}-next-

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  all-gates:
    name: All Required Gates Passed
    if: always()
    needs: [detect_changes, lint, tests, real-db-e2e, security, migrations, build]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required results
        env:
          DETECT_RESULT: ${{ needs.detect_changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          REAL_DB_E2E_RESULT: ${{ needs.real-db-e2e.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          MIGRATION_RESULT: ${{ needs.migrations.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          for result in "$DETECT_RESULT" "$LINT_RESULT" "$TEST_RESULT" "$REAL_DB_E2E_RESULT" "$SECURITY_RESULT" "$MIGRATION_RESULT" "$BUILD_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Required gate failed or was cancelled: $result"; exit 1 ;;
            esac
          done

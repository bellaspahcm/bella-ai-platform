name: Decision Engine Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/decision-engine/**'
      - 'supabase/migrations/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/decision-engine/**'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - '.github/workflows/decision-engine-deploy.yml'

jobs:
  test:
    name: Test Decision Engine
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run type check
        run: npm run build
      
      - name: Run Decision Engine tests
        run: npm test -- src/lib/decision-engine
        env:
          NODE_ENV: test
      
      - name: Run integration tests
        run: >
          npx jest --runInBand --runTestsByPath
          src/lib/decision-engine/__tests__/integration.test.ts
          src/lib/decision-engine/registry/__tests__/PolicyRegistry.integration.test.ts
          src/lib/decision-engine/providers/payroll/__tests__/payroll-provider.integration.test.ts
          src/lib/decision-engine/providers/commission/__tests__/commission-provider.integration.test.ts
          src/lib/decision-engine/providers/inventory/__tests__/inventory-provider.integration.test.ts
        if: github.event_name == 'pull_request'
        env:
          NODE_ENV: test
      
      - name: Performance benchmark
        run: npx tsx scripts/benchmark-decision-engine.ts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
      
      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-results
          path: |
            coverage/
            test-results/

  deploy-staging:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check Vercel staging config
        id: vercel_config
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel staging deployment skipped: Vercel secrets are not configured for this repository."
          fi
      
      - name: Deploy to Vercel Staging
        if: steps.vercel_config.outputs.configured == 'true'
        uses: amondnet/vercel-action@2d78157ee070f28ff89dd4da74e0369fc26d3b34
        id: deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
      
      - name: Run smoke tests
        if: steps.vercel_config.outputs.configured == 'true'
        run: npm run test:smoke -- --env=staging
        env:
          STAGING_URL: ${{ steps.deploy.outputs.preview-url }}
      
      - name: Comment PR with preview URL
        if: steps.vercel_config.outputs.configured == 'true'
        uses: actions/github-script@00f12e3e20659f42342b1c0226afda7f7c042325
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Staging deployment complete!\n\nPreview: ${process.env.STAGING_URL}`
            })

  deploy-production:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check production deployment config
        id: production_config
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "deploy_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel production deployment skipped: Vercel secrets are not configured for this repository."
          fi

          if [ -n "$PRODUCTION_URL" ]; then
            echo "smoke_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "smoke_configured=false" >> "$GITHUB_OUTPUT"
            echo "Production smoke tests skipped: PRODUCTION_URL is not configured."
          fi

          if [ -n "$REDIS_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "warmup_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "warmup_configured=false" >> "$GITHUB_OUTPUT"
            echo "Cache warmup skipped: REDIS_URL or SUPABASE_SERVICE_ROLE_KEY is not configured."
          fi

          if [ -n "$SLACK_WEBHOOK" ]; then
            echo "slack_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "slack_configured=false" >> "$GITHUB_OUTPUT"
            echo "Slack notification skipped: SLACK_WEBHOOK is not configured."
          fi
      
      - name: Deploy to Vercel Production
        if: steps.production_config.outputs.deploy_configured == 'true'
        uses: amondnet/vercel-action@2d78157ee070f28ff89dd4da74e0369fc26d3b34
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID }}
      
      - name: Wait for deployment
        if: steps.production_config.outputs.deploy_configured == 'true'
        run: sleep 30
      
      - name: Run production smoke tests
        if: steps.production_config.outputs.deploy_configured == 'true' && steps.production_config.outputs.smoke_configured == 'true'
        run: npm run test:smoke -- --env=production
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      
      - name: Warmup cache
        if: steps.production_config.outputs.deploy_configured == 'true' && steps.production_config.outputs.warmup_configured == 'true'
        run: npm run cache:warmup -- --env=production
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      
      - name: Notify Slack
        uses: 8398a7/action-slack@f3635935f58910a6d6951b73efe9037c960c8c04
        if: always() && steps.production_config.outputs.slack_configured == 'true'
        with:
          status: ${{ job.status }}
          text: 'Decision Engine deployed to production'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

name: BDGF AutoMove Hash-Bound Production Adoption

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_AUTOMOVE_SCHEMA_SECURITY_ONLY. Runtime remains closed.
        required: true
        type: string
      approved_sha256:
        description: Exact approved immutable adoption SHA-256.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bdgf-automove-production-adoption
  cancel-in-progress: false

jobs:
  adopt:
    if: github.repository == 'bellaspahcm/bella-ai-platform' && github.ref == 'refs/tags/bdgf-automove-adoption-20261016'
    name: Apply approved schema and security only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Install without lifecycle scripts or Production secrets
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify immutable artifacts and deployment safety
        run: node --test scripts/bdgf/apply-automove-production-adoption.test.mjs
      - name: Execute once through canonical owner-operated BDGF
        env:
          ADOPTION_CONFIRMATION: ${{ inputs.confirmation }}
          ADOPTION_APPROVED_SHA256: ${{ inputs.approved_sha256 }}
          AUTOMOVE_PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
          GATE_SIGNING_KEY_FROM_SECRETS_MANAGER: ${{ secrets.GATE_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          BDGF_USE_SECRETS_MANAGER: 'false'
          SECRETS_CACHE_ENABLED: 'false'
          NODE_OPTIONS: ''
          NODE_ENV: production
        run: node scripts/bdgf/apply-automove-production-adoption.mjs
      - name: Retain sanitized execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: automove-production-adoption-${{ github.sha }}
          path: .cache/automove-production-adoption/execution-evidence.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
